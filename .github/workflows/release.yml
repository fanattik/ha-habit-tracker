name: Release

# Publishes a GitHub release for every new version in manifest.json,
# so HACS can offer it as an update in Home Assistant.
on:
  push:
    branches: [main]
    paths: [custom_components/habit_tracker/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/habit_tracker/manifest.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
